<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== Core SEO ===== -->
    <title>Olóri Bride House | Luxury Bridal Concierge in Lagos</title>
    <meta
      name="description"
      content="Luxury bridal concierge in Lagos. A dedicated personal assistant takes care of you before and on your wedding day. Packages from ₦100,000."
    />
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#8E3B52" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ===== Social sharing (WhatsApp, Facebook, Instagram, LinkedIn) ===== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Olóri Bride House" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:title" content="Olóri Bride House | Luxury Bridal Concierge in Lagos" />
    <meta
      property="og:description"
      content="Dedicated, personal support before and during your wedding, so you can simply be present and enjoy every moment."
    />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Olóri Bride House — luxury bridal concierge in Lagos" />

    <!-- ===== X / Twitter ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Olóri Bride House | Luxury Bridal Concierge in Lagos" />
    <meta
      name="twitter:description"
      content="Dedicated, personal support before and during your wedding in Lagos."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.jpg" />

    <!-- ===== Structured data for Google (keep prices in sync with src/config/site.js) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Olóri Bride House",
        "description": "Luxury bridal concierge and personal assistant service for brides in Lagos, providing dedicated support before and during the wedding.",
        "url": "https://YOUR-DOMAIN.com/",
        "image": "https://YOUR-DOMAIN.com/og-image.jpg",
        "priceRange": "₦100,000 – ₦350,000",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lagos",
          "addressCountry": "NG"
        },
        "areaServed": { "@type": "City", "name": "Lagos" },
        "parentOrganization": { "@type": "Organization", "name": "Luxury By Olori Concept" },
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Bridal concierge packages",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "D-Day Bridal Concierge", "description": "1 day of bridal concierge support on the wedding day." },
              "price": "100000",
              "priceCurrency": "NGN"
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "3-Days Bridal Concierge", "description": "3 days of bridal concierge support before and during the wedding." },
              "price": "220000",
              "priceCurrency": "NGN"
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Service", "name": "7-Days Bridal Concierge", "description": "Full wedding-week bridal concierge support." },
              "price": "350000",
              "priceCurrency": "NGN"
            }
          ]
        }
      }
    </script>

    <!-- ===== Fonts ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
